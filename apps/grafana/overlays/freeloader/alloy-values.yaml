---
# Metric whitelist inventory: see apps/grafana/METRICS.md.
# Any change to includeMetrics/excludeMetrics here must be mirrored in METRICS.md.
cluster:
  name: freeloader

destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: https://prometheus-prod-24-prod-eu-west-2.grafana.net/api/prom/push
    auth:
      type: basic
      username: "2355589"
  grafana-cloud-logs:
    type: loki
    url: https://logs-prod-012.grafana.net/loki/api/v1/push
    auth:
      type: basic
      username: "1173472"

global:
  scrapeInterval: 120s

# -- Kubernetes observability --

clusterMetrics:
  enabled: true
  collector: alloy-metrics
  kube-state-metrics:
    metricsTuning:
      useDefaultAllowList: false
      includeMetrics:
        - kube_node_info
        - kube_node_status_condition
        - kube_node_spec_unschedulable
        - kube_pod_info
        - kube_pod_status_phase
        - kube_pod_status_ready
        - kube_pod_container_status_restarts_total
        - kube_pod_container_status_waiting_reason
        - kube_pod_container_status_terminated_reason
        - kube_deployment_status_replicas_available
        - kube_deployment_status_replicas_unavailable
        - kube_statefulset_status_replicas_ready
        - kube_daemonset_status_number_unavailable
        - kube_persistentvolume_status_phase
        - kube_persistentvolumeclaim_status_phase
  kubelet:
    metricsTuning:
      useDefaultAllowList: false
      includeMetrics:
        - kubelet_node_name
        - kubelet_volume_stats_available_bytes
        - kubelet_volume_stats_capacity_bytes
  cadvisor:
    metricsTuning:
      useDefaultAllowList: false
      includeMetrics:
        - container_cpu_usage_seconds_total
        - container_memory_working_set_bytes
        - container_oom_events_total
        - container_last_seen
  apiServer:
    enabled: true
    metricsTuning:
      includeMetrics:
        - apiserver_request_total
        - apiserver_current_inflight_requests
  controlPlane:
    enabled: false

hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true
    metricsTuning:
      useIntegrationAllowList: true
      excludeMetrics:
        - node_network_receive_.*
        - node_network_transmit_.*
        - node_disk_io_time_weighted_seconds_total
        - node_scrape_collector_.*

annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics
  annotations:
    scrape: prometheus.io/scrape
    metricsPath: prometheus.io/path
    metricsPortNumber: prometheus.io/port
  metricsTuning:
    excludeMetrics:
      - go_.*
      - process_.*
      - .*_bucket
      - .*_sum

# Disabled by design: no app currently ships a ServiceMonitor or PodMonitor
# that should be consumed. To re-enable for a namespace, flip enabled: true
# and populate serviceMonitors.namespaces (positive allowlist).
prometheusOperatorObjects:
  enabled: false
  # collector: alloy-metrics
  # serviceMonitors:
  #   namespaces: [<namespace>]
  #   metricsTuning:
  #     excludeMetrics: [".*_bucket", ".*_sum"]
  # podMonitors:
  #   namespaces: [<namespace>]
  #   metricsTuning:
  #     excludeMetrics: [".*_bucket", ".*_sum"]

clusterEvents:
  enabled: true
  collector: alloy-singleton

podLogsViaLoki:
  enabled: true
  collector: alloy-daemonset
  excludeNamespaces: [kube-system, flux-system, velero]
  extraLogProcessingStages: |-
    stage.match {
      selector = "{namespace=\"grafana\", app=\"alloy\"} |~ \"level=info\""
      action = "drop"
    }
    stage.match {
      selector = "{namespace=\"argo-cd\", app=\"argocd-repo-server\"} |~ \"level=info\""
      action = "drop"
    }

nodeLogs:
  enabled: true
  collector: alloy-daemonset
  extraLogProcessingStages: |-
    stage.match {
      selector = "{unit=\"kubelet.service\"} |~ \"level=info\""
      action = "drop"
    }

# -- Self-monitoring --

integrations:
  alloy:
    instances:
      - name: alloy-metrics
        labelSelectors:
          app.kubernetes.io/name: alloy-metrics
        metrics:
          tuning:
            excludeMetrics:
              - alloy_component_dependencies_wait_seconds_bucket
              - alloy_component_evaluation_seconds_bucket
      - name: alloy
        labelSelectors:
          app.kubernetes.io/name: [alloy-daemonset, alloy-singleton]
        metrics:
          tuning:
            useDefaultAllowList: false
            includeMetrics:
              - alloy_build_info
              - prometheus_remote_storage_samples_total
              - prometheus_remote_storage_samples_failed_total
              - prometheus_remote_storage_sent_bytes_total

# -- Collectors --

collectors:
  alloy-metrics:
    enabled: true
    presets: [clustered, statefulset]
  alloy-daemonset:
    enabled: true
    presets: [daemonset, filesystem-log-reader]
  alloy-singleton:
    enabled: true
    presets: [singleton]

telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
